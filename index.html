<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的表情包图库</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color-scheme:light}body{margin:0;background:#f8f8fc;color:#262638}header{padding:26px max(20px,calc((100vw - 1080px)/2));background:white;border-bottom:1px solid #e8e8ef}h1{margin:0 0 8px;font-size:26px}p{color:#666;margin:4px 0}main{max-width:1080px;margin:auto;padding:22px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d4d4df;border-radius:12px;font-size:16px}.stats{margin:15px 0;color:#777}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.card{background:white;border:1px solid #e9e9f0;border-radius:16px;padding:14px;text-align:center}.card img{width:130px;height:130px;object-fit:contain}.card small{display:block;color:#888;margin:8px 0}.card button{border:0;border-radius:8px;background:#33334c;color:white;padding:9px 12px;cursor:pointer}.notice{font-size:13px;margin-top:25px}.empty{padding:30px;color:#999}</style></head><body><header><h1>🐶 我的表情包图库</h1><p>官方 CDN 图片预览 · 不在本站存储原图</p><p>优先来源：<a href="https://www.sina.cn/media/5626763209" target="_blank" rel="noopener noreferrer">① 月薪喵作者主页</a> · <a href="https://store.line.me/stickershop/product/13716526/ja" target="_blank" rel="noopener noreferrer">② 吉伊卡哇（ナガノ）</a> · <a href="https://store.line.me/stickershop/product/30890/zh-Hant" target="_blank" rel="noopener noreferrer">③ 线条小狗</a></p><p>下方已验证图库目前仅含24张线条小狗；月薪喵、吉伊卡哇链接为来源入口。</p></header><main><input id="search" placeholder="搜索角色、ID 或标签…"><div class="stats" id="stats">加载中…</div><div class="grid" id="grid"></div><p class="notice">图像版权归原作者所有。本页面仅整理已验证的外部链接。图像是否能在 ChatGPT 聊天中按指定 URL 嵌入，仍取决于客户端支持。</p></main><script>
const grid=document.getElementById('grid'),stats=document.getElementById('stats'),search=document.getElementById('search');let all=[];
function draw(){let q=search.value.trim().toLowerCase();let items=all.filter(x=>[x.collection,x.sticker_id,...(x.tags||[])].join(' ').toLowerCase().includes(q));stats.textContent='显示 '+items.length+' / '+all.length+' 张';grid.replaceChildren();for(let x of items){let card=document.createElement('div');card.className='card';let img=document.createElement('img');img.src=x.image_url;img.alt=x.collection+' #'+x.sticker_id;img.loading='lazy';let small=document.createElement('small');small.textContent=x.collection+' · '+x.sticker_id;let button=document.createElement('button');button.textContent='复制图片链接';button.onclick=async()=>{try{await navigator.clipboard.writeText(x.image_url);button.textContent='已复制 ✓'}catch{prompt('复制链接',x.image_url)}};card.append(img,small,button);grid.append(card)}if(!items.length){grid.textContent='没有匹配的表情'}}
search.addEventListener('input',draw);
fetch('./emojis/index.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{all=d.images||[];draw()}).catch(e=>{stats.textContent='读取索引失败：'+e.message+'（请通过 HTTP 服务打开，勿直接双击本文件）'});
</script></body></html>
